<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer Portal</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;background:#f5f6f8;color:#1b2540}.top{background:#14213d;color:#fff;padding:16px 18px}.top h1{margin:0;font-size:1.1rem}.top small{color:#c9d0e2}.w{max-width:760px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #e1e5ee;border-radius:12px;padding:14px;margin-bottom:12px}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{flex:1;padding:10px;border:1px solid #d5dae5;background:#fff;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:#14213d;color:#fff;border-color:#14213d}label{display:block;font-size:.82rem;margin:10px 0 3px;color:#52607d}input,select,textarea{width:100%;padding:10px;border:1px solid #d5dae5;border-radius:8px;font:inherit}.b{display:block;width:100%;margin-top:14px;padding:12px;background:#f2a541;border:0;border-radius:10px;font:inherit;font-weight:700;color:#14213d;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:7px 6px;border-bottom:1px solid #eef0f5;text-align:left}.n{text-align:right}.big{font-size:1.6rem;font-weight:700}.ok{color:#17703a;font-weight:700}.err{color:#b3261e}.mut{color:#52607d;font-size:.82rem}</style></head><body>
<div class="top"><h1 id="co">Customer Portal</h1><small id="cu"></small></div><div class="w" id="app"><div class="card">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://zaogpwfobqvayeejfvxc.supabase.co','sb_publishable_NWe7FFqt7_C0qOOZoqvsFQ_tH9qBCty',{auth:{persistSession:false}});
const T=new URLSearchParams(location.search).get('t')||'', $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), fd=s=>{ const p=String(s||'').slice(0,10).split('-'); return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:''; };
let D=null, tab='read', photo='';
async function init(){ if(!T){ $('app').innerHTML='<div class="card err">This link is not valid. Please ask us for a new one.</div>'; return; } const r=await sb.rpc('portal_get',{t:T}); if(r.error||!r.data){ $('app').innerHTML='<div class="card err">This link is not valid or has been turned off. Please contact us for a new one.</div>'; return; } D=r.data; $('co').textContent=D.company.name||'Customer Portal'; $('cu').textContent=D.customer.name; draw(); }
function balance(){ let b=0; D.invoices.forEach(v=>b+=+v.total||0); D.ledger.forEach(l=>{ const a=+l.amount||0; b+=(l.type==='opening'||l.type==='latefee')?a:-a; }); return Math.round(b*100)/100; }
function mopts(){ return D.machines.map(m=>'<option value="'+esc(m.id)+'">'+esc((m.model||'')+(m.serial?' · '+m.serial:'')+(m.dept?' · '+m.dept:''))+'</option>').join(''); }
function draw(){ const tabs=[['read','Meter reading'],['inv','Invoices'],['help','Toner / Problem']]; let h='<div class="tabs">'+tabs.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';draw()">'+t[1]+'</button>').join('')+'</div>';
  if(tab==='read'){ h+='<div class="card"><b>Send this month’s meter reading</b>'+(D.machines.length?'<label>Machine</label><select id="rm" onchange="lastInfo()">'+mopts()+'</select><div class="mut" id="li"></div><label>Black &amp; white counter *</label><input id="r1" type="number" inputmode="numeric"><label>Colour counter (if it is a colour machine)</label><input id="r2" type="number" inputmode="numeric"><label>Date</label><input id="rd" type="date" value="'+new Date().toISOString().slice(0,10)+'"><label>Photo of the counter page (optional)</label><input id="rp" type="file" accept="image/*" capture="environment" onchange="pick(this)"><label>Note</label><input id="rn"><button class="b" onclick="sendRead()">Send reading</button>':'<div class="mut">No machines on file.</div>')+'</div>'; }
  if(tab==='inv'){ const b=balance(); h+='<div class="card"><div class="mut">Balance due</div><div class="big '+(b>0?'err':'ok')+'">AED '+fm(b)+'</div></div><div class="card"><b>Invoices</b><table><thead><tr><th>No.</th><th>Date</th><th>Due</th><th class="n">Total</th></tr></thead><tbody>'+(D.invoices.length?D.invoices.map(v=>'<tr><td>'+esc(v.no)+'</td><td>'+fd(v.date)+'</td><td>'+fd(v.due)+'</td><td class="n">'+fm(v.total)+'</td></tr>').join(''):'<tr><td colspan="4" class="mut">No invoices.</td></tr>')+'</tbody></table></div><div class="card"><b>Payments &amp; credits</b><table><tbody>'+(D.ledger.length?D.ledger.map(l=>'<tr><td>'+fd(l.date)+'</td><td>'+esc(l.type)+'</td><td>'+esc(l.ref||'')+'</td><td class="n">'+fm(l.amount)+'</td></tr>').join(''):'<tr><td class="mut">None.</td></tr>')+'</tbody></table></div><div class="mut">Questions? '+esc(D.company.phone||'')+' '+esc(D.company.email||'')+'</div>'; }
  if(tab==='help'){ h+='<div class="card"><b>Request toner or report a problem</b><label>Request</label><select id="hk"><option value="toner">Toner / consumable request</option><option value="ticket">Problem / service request</option></select><label>Machine</label><select id="hm"><option value="">— not machine specific —</option>'+mopts()+'</select><label>Details *</label><textarea id="ht" rows="4" placeholder="e.g. Black toner is low / paper jam error E12"></textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="hu" style="width:auto"> Urgent</label><button class="b" onclick="sendHelp()">Send request</button></div>'; }
  $('app').innerHTML=h; if(tab==='read'&&D.machines.length) lastInfo(); }
function lastInfo(){ const m=D.machines.find(x=>x.id===$('rm').value), l=m&&m.last; $('li').textContent=l?'Last reading'+(l.date?' ('+fd(l.date)+')':'')+': B&W '+(l.me||0)+(l.ce?' · Colour '+l.ce:''):'No previous reading on file.'; }
function pick(el){ photo=''; const f=el.files[0]; if(!f) return; const im=new Image(); im.onload=()=>{ const s=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); photo=c.toDataURL('image/jpeg',.6); if(photo.length>250000) photo=''; }; im.src=URL.createObjectURL(f); }
async function submit(kind,p){ const r=await sb.rpc('portal_submit',{t:T,k:kind,p}); if(r.error||!r.data||!r.data.ok){ alert((r.data&&r.data.error)||'Could not send. Please try again or call us.'); return; } $('app').innerHTML='<div class="card"><div class="big ok">✔ Thank you</div><p>We have received your request.</p><button class="b" onclick="draw()">Back</button></div>'; }
function sendRead(){ const mono=$('r1').value; if(mono===''||+mono<0){ alert('Please enter the black & white counter.'); return; } const m=D.machines.find(x=>x.id===$('rm').value), l=m&&m.last; if(l&&+mono<+(l.me||0)&&!confirm('This is lower than the last reading ('+l.me+'). Send anyway?')) return; submit('reading',{mid:$('rm').value,mono:+mono,color:$('r2').value===''?'':+$('r2').value,date:$('rd').value,note:$('rn').value.slice(0,300),photo}); }
function sendHelp(){ const t=$('ht').value.trim(); if(!t){ alert('Please describe your request.'); return; } submit($('hk').value,{mid:$('hm').value,text:t.slice(0,800),urgent:$('hu').checked}); }
init();
</script></body></html>
